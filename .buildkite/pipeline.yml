# Throwaway experiment: which bash.exe does `bash` resolve to on the windows queue, vs. Git's?
steps:
  - label: "DIAG: which bash"
    command: |
      Write-Output "DIAG where.exe bash:"
      where.exe bash
      Write-Output "DIAG Get-Command bash -All:"
      Get-Command bash -All | ForEach-Object { $$_.Source }
      Write-Output "DIAG PATH entries:"
      $$env:PATH -split ';'
      Write-Output "DIAG git --version:"
      git --version
      Write-Output "DIAG PATH bash --version:"
      bash --version | Select-Object -First 1
      Write-Output "DIAG Git bash --version:"
      & "C:\Program Files\Git\bin\bash.exe" --version | Select-Object -First 1
      Write-Output "DIAG PATH bash self-report:"
      bash -c 'echo BASH=$$BASH; echo BASH_VERSION=$$BASH_VERSION; echo OSTYPE=$$OSTYPE; echo MSYSTEM=$$MSYSTEM; uname -a; command -v powershell; command -v bash'
      Write-Output "DIAG Git bash self-report:"
      & "C:\Program Files\Git\bin\bash.exe" -c 'echo BASH=$$BASH; echo BASH_VERSION=$$BASH_VERSION; echo OSTYPE=$$OSTYPE; echo MSYSTEM=$$MSYSTEM; uname -a; command -v powershell; command -v bash'
      Write-Output "DIAG get_libc_version via each bash:"
      bash bin/get_libc_version
      & "C:\Program Files\Git\bin\bash.exe" bin/get_libc_version
    agents: { queue: windows }
