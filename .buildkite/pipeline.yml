steps:
  - label: "🕵️ Lint"
    command: make lint

  - label: "🔬 Test"
    command: make test

  - group: ":swift: Swift Caching Tests"
    steps:
      - label: ":swift: Standalone Swift Package - Autodetect"
        command: |
          export PATH=$PATH:./bin
          # cd tests/spm_caching/standalone_package
          # install_swiftpm_dependencies
          # swift test
          echo "^^^ +++ Temporarily disabled because it fails, see https://buildkite.com/automattic/ci-toolkit-buildkite-plugin/builds/671"
        agents:
          queue: mac
        env:
          IMAGE_ID: xcode-15.4

      - label: ":swift: Standalone Swift Package - Explicit"
        command: |
          export PATH=$PATH:./bin
          cd tests/spm_caching/standalone_package
          install_swiftpm_dependencies --use-spm
          swift test
        agents:
          queue: mac
        env:
          IMAGE_ID: xcode-15.4
