# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# For convenience with the many install_swiftpm_dependencies steps, we declare agents and env for macOS in the root, then specialize the fewer remaining steps
agents:
  queue: mac
env:
  IMAGE_ID: xcode-15.4

steps:
  - label: Windows test inline Bash
    command: |
      echo "I'm about to exit 2. I expect this step to fail..."
      exit 2
    agents:
      queue: windows

  - label: Windows test Bash script
    command: |
      $$ErrorActionPreference = "Stop"
      & .buildkite\commands\command-that-fails.sh

      if ($$LASTEXITCODE -ne 0) {
        Write-Error "Shell script failed with exit code $$LASTEXITCODE"
        exit $$LASTEXITCODE
      }
    agents:
      queue: windows

  - label: Windows test Bash script no set -e
    command: .buildkite/commands/command-that-fails-without-set-e.sh
    agents:
      queue: windows

  - label: Windows test PS1 script that fails
    command: .buildkite/commands/command-that-fails-internally.ps1
    agents:
      queue: windows

  - label: Windows test PS1 script that call script that fails
    command: .buildkite/commands/command-that-calls-other-ps1-failing.ps1
    agents:
      queue: windows

  - label: ":sleuth_or_spy: Lint"
    command: make lint
    notify:
      - github_commit_status:
          context: Lint
    agents:
      queue: default

  - label: ":microscope: Test"
    command: make test
    notify:
      - github_commit_status:
          context: Test
    agents:
      queue: default

  - label: ":danger: Danger - PR Check"
    command: danger
    key: danger
    if: build.pull_request.id != null
    retry:
      manual:
        permit_on_passed: true
    notify:
      - github_commit_status:
          context: Danger - PR Check
    agents:
      queue: linter


  - label: ":windows: :test_tube: Run Windows Tests"
    command: buildkite-agent pipeline upload .buildkite/pipeline-windows-tests.yml
    agents:
      queue: upload

  - label: ":bash: :test_tube: Run Bash Commands Tests"
    command: buildkite-agent pipeline upload .buildkite/pipeline-bash-tests.yml
    agents:
      queue: upload
