# Throwaway experiment (do not merge): round 9, end to end. The real bin/notify_skipped_steps from #257 runs, then uploads a pipeline whose skipped step opts in with an `if:`.
agents:
  queue: upload

steps:
  - label: ":microscope: runner: notify_skipped_steps then upload"
    command: |
      bin/notify_skipped_steps .buildkite/exp-e2e-pipeline.yml
      buildkite-agent pipeline upload .buildkite/exp-e2e-pipeline.yml
