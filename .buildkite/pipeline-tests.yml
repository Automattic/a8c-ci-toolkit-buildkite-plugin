# yaml-language-server: $schema=https://raw.githubusercontent.com/buildkite/pipeline-schema/main/schema.json
---

# For convenience with the many install_swiftpm_dependencies steps, we declare agents and env for macOS in the root, then specialize the fewer remaining steps
agents:
  queue: mac
env:
  IMAGE_ID: $IMAGE_ID

steps:
  # Each group runs only if its helper, the helpers it calls, its tests or this file changed (`if_changed` is applied when this file is uploaded).
  # Every group has a `mac` job, so each also lists `shared-pipeline-vars`, which sets the Xcode image: a new image gets validated by all of them.
  # Only the build-level check is required on trunk, so a skipped step doesn't leave a pending status.
  - group: ":c: get_libc_version Tests"
    if_changed:
      - bin/get_libc_version
      - tests/validate_get_libc_version_format
      - .buildkite/pipeline-tests.yml
      - .buildkite/shared-pipeline-vars
    steps:
      - label: ":c: Test get_libc_version on {{matrix}}"
        # Explicit `bash` as Windows can't run the script through its shebang
        command: bash -eu ./tests/validate_get_libc_version_format
        agents:
          queue: "{{matrix}}"
        matrix:
          - android
          - default
          - mac
          - tumblr-metal
          - windows

  - group: ":swift: install_swiftpm_dependencies Tests"
    if_changed:
      - bin/*swiftpm*
      - bin/{restore_cache,save_cache,hash_file,hash_directory,add_host_to_ssh_known_hosts}
      - tests/install_swiftpm_dependencies/**
      - .buildkite/pipeline-tests.yml
      - .buildkite/shared-pipeline-vars
    steps:
      - label: ":swift: Standalone Swift Package - Autodetect"
        command: tests/install_swiftpm_dependencies/test_scripts/test_package_automatic.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Standalone Swift Package - Autodetect"

      - label: ":swift: Standalone Swift Package - Explicit"
        command: tests/install_swiftpm_dependencies/test_scripts/test_package_explicit.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Standalone Swift Package - Explicit"

      - label: ":swift: Standalone Swift Package - Restore and save without resolving"
        command: tests/install_swiftpm_dependencies/test_scripts/test_package_restore_and_save.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Standalone Swift Package - Restore and save"

      - label: ":xcode: Xcode Project - Autodetect"
        command: tests/install_swiftpm_dependencies/test_scripts/test_project_automatic.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Xcode Project - Autodetect"

      - label: ":xcode: Xcode Project - Explicit"
        command: tests/install_swiftpm_dependencies/test_scripts/test_project_explicit.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Xcode Project - Explicit"

      - label: ":xcode: Xcode Project - No Package.resolved"
        command: tests/install_swiftpm_dependencies/test_scripts/test_project_no_package.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Xcode Project - No Package.resolved"

      - label: ":xcode: Xcode Workspace - Autodetect"
        command: tests/install_swiftpm_dependencies/test_scripts/test_workspace_automatic.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Xcode Workspace - Autodetect"

      - label: ":xcode: Xcode Workspace - Explicit"
        command: tests/install_swiftpm_dependencies/test_scripts/test_workspace_explicit.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Xcode Workspace - Explicit"

      - label: ":xcode: Xcode Workspace - Binary frameworks cache"
        command: tests/install_swiftpm_dependencies/test_scripts/test_workspace_artifacts.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Xcode Workspace - Binary frameworks cache"

      - label: ":xcode: Xcode Workspace and Project - Autodetect"
        command: tests/install_swiftpm_dependencies/test_scripts/test_workspace_and_project_automatic.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Xcode Workspace and Project - Autodetect"

      - label: ":xcode: Xcode Workspace and Project - Explicit"
        command: tests/install_swiftpm_dependencies/test_scripts/test_workspace_and_project_explicit.sh
        notify:
          - github_commit_status:
              context: "install_swiftpm_dependencies Tests: Xcode Workspace and Project - Explicit"

  - group: ":git: commit_changed_files Tests"
    steps:
      - label: ":git: commit_changed_files Tests - Commit Ranges"
        command: tests/commit_changed_files/test_commit_ranges.sh
        agents:
          queue: "{{matrix}}"
        matrix:
          - android
          - default
          - mac
          - tumblr-metal
        notify:
          - github_commit_status:
              context: "commit_changed_files Tests: Commit Ranges"

  - group: ":github: pr_changed_files Tests"
    if_changed:
      - bin/pr_changed_files
      - tests/pr_changed_files/**
      - .buildkite/pipeline-tests.yml
      - .buildkite/shared-pipeline-vars
    steps:
      - label: ":github: pr_changed_files Tests - Basic Changes"
        command: tests/pr_changed_files/test_basic_changes.sh
        agents:
          queue: "{{matrix}}"
        matrix:
          - android
          - default
          - mac
          - tumblr-metal
        notify:
          - github_commit_status:
              context: "pr_changed_files Tests: Basic Changes"

      - label: ":github: pr_changed_files Tests - Any Match"
        command: tests/pr_changed_files/test_any_match_patterns.sh
        agents:
          queue: "{{matrix}}"
        matrix:
          - android
          - default
          - mac
          - tumblr-metal
        notify:
          - github_commit_status:
              context: "pr_changed_files Tests: Any Match"

      - label: ":github: pr_changed_files Tests - All Match"
        command: tests/pr_changed_files/test_all_match_patterns.sh
        agents:
          queue: "{{matrix}}"
        matrix:
          - android
          - default
          - mac
          - tumblr-metal
        notify:
          - github_commit_status:
              context: "pr_changed_files Tests: All Match"

      - label: ":github: pr_changed_files Tests - Edge Cases"
        command: tests/pr_changed_files/test_edge_cases.sh
        agents:
          queue: "{{matrix}}"
        matrix:
          - android
          - default
          - mac
          - tumblr-metal
        notify:
          - github_commit_status:
              context: "pr_changed_files Tests: Edge Cases"

      - label: ":github: pr_changed_files Tests - Git History"
        command: tests/pr_changed_files/test_git_history.sh
        agents:
          queue: "{{matrix}}"
        matrix:
          - android
          - default
          - mac
          - tumblr-metal
        notify:
          - github_commit_status:
              context: "pr_changed_files Tests: Git History"

  - group: ":speech_balloon: notify_skipped_steps Tests"
    if_changed:
      - bin/notify_skipped_steps
      - tests/notify_skipped_steps/**
      - .buildkite/pipeline-tests.yml
    steps:
      - label: ":speech_balloon: notify_skipped_steps Tests"
        command: tests/notify_skipped_steps/test_notify_skipped_steps.sh
        agents:
          queue: upload
        notify:
          - github_commit_status:
              context: "notify_skipped_steps Tests"

  - group: ":closed_lock_with_key: install_a8c-secrets_binary Integration Tests"
    if_changed:
      - bin/{install_a8c-secrets_binary,hash_file}
      - tests/install_a8c-secrets_binary/**
      - .buildkite/pipeline-tests.yml
      - .buildkite/shared-pipeline-vars
    steps:
      - label: ":linux: Install and run a8c-secrets"
        command: tests/install_a8c-secrets_binary/test_install.sh
        agents:
          queue: default
        notify:
          - github_commit_status:
              context: "install_a8c-secrets_binary Tests: Linux"

      - label: ":apple: Install and run a8c-secrets"
        command: tests/install_a8c-secrets_binary/test_install.sh
        agents:
          queue: mac
        notify:
          - github_commit_status:
              context: "install_a8c-secrets_binary Tests: macOS"
